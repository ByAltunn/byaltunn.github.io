<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dev/ByAltun | Professional Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0b1120; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden-panel { display: none; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="glass sticky top-0 p-6 flex justify-between items-center z-40">
    <h1 class="text-3xl font-black text-indigo-400 cursor-pointer" onclick="checkAdmin()">dev/ByAltun</h1>
    <select id="lang" onchange="render()" class="bg-slate-800 p-2 rounded-lg border border-slate-600">
        <option value="tr">🇹🇷 TR</option><option value="ua">🇺🇦 UA</option>
        <option value="en">🇺🇸 ENG</option><option value="ru">🇷🇺 RU</option>
    </select>
</nav>

<!-- Duyuru -->
<div id="announcementBox" class="max-w-5xl mx-auto mt-8 p-6 glass rounded-2xl border-l-4 border-indigo-500"></div>

<!-- Uygulamalar -->
<div id="appGrid" class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

<!-- Admin Paneli -->
<div id="adminPanel" class="hidden-panel fixed inset-0 bg-black/95 z-50 overflow-y-auto p-10">
    <div class="max-w-3xl mx-auto bg-slate-900 p-8 rounded-3xl border border-slate-700">
        <h2 class="text-3xl font-bold mb-6">Admin Panel</h2>
        
        <!-- Şifre Ayarları -->
        <div class="mb-8 p-4 bg-slate-800 rounded-xl">
            <p>Admin Şifresi: <span id="viewPass" class="font-mono text-indigo-400"></span></p>
            <input type="text" id="newPass" placeholder="Yeni Şifre" class="w-full mt-2 p-2 bg-slate-700 rounded">
            <button onclick="changePass()" class="mt-2 bg-blue-600 px-4 py-1 rounded">Şifreyi Değiştir</button>
        </div>

        <!-- Uygulama Ekleme -->
        <div class="grid grid-cols-2 gap-4">
            <input id="inNameTr" placeholder="Ad (TR)" class="p-2 bg-slate-800 rounded">
            <input id="inNameUa" placeholder="Ad (UA)" class="p-2 bg-slate-800 rounded">
            <input id="inNameEn" placeholder="Ad (ENG)" class="p-2 bg-slate-800 rounded">
            <input id="inNameRu" placeholder="Ad (RU)" class="p-2 bg-slate-800 rounded">
            <textarea id="inDescTr" placeholder="Açıklama (TR)" class="col-span-2 p-2 bg-slate-800 rounded"></textarea>
            <input id="inLink" placeholder="Google Play Link" class="col-span-2 p-2 bg-slate-800 rounded">
        </div>
        <button onclick="addApp()" class="w-full mt-4 bg-green-600 p-3 rounded-xl font-bold">Uygulamayı Ekle</button>
        <button onclick="closeAdmin()" class="w-full mt-2 bg-red-600 p-3 rounded-xl">Kapat</button>
    </div>
</div>

<script>
    // Güvenlik ve Veri
    document.addEventListener('contextmenu', e => e.preventDefault());
    let apps = JSON.parse(localStorage.getItem('apps')) || [];
    let pass = localStorage.getItem('adminPass') || '1234';

    function render() {
        const lang = document.getElementById('lang').value;
        document.getElementById('appGrid').innerHTML = apps.map((app, i) => `
            <div class="glass p-6 rounded-2xl hover:border-indigo-500 transition">
                <h3 class="text-2xl font-bold">${app.name[lang]}</h3>
                <p class="mt-3 opacity-70">${app.desc[lang]}</p>
                <a href="${app.link}" class="mt-4 block bg-indigo-600 text-center py-3 rounded-xl">Google Play</a>
                <button onclick="deleteApp(${i})" class="text-red-400 text-sm mt-2">Sil</button>
            </div>
        `).join('');
    }

    function checkAdmin() {
        let p = prompt("Admin Şifresi:");
        if(p === pass) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('viewPass').innerText = pass;
        }
    }

    function addApp() {
        apps.push({
            name: {tr: document.getElementById('inNameTr').value, ua: document.getElementById('inNameUa').value, en: document.getElementById('inNameEn').value, ru: document.getElementById('inNameRu').value},
            desc: {tr: document.getElementById('inDescTr').value},
            link: document.getElementById('inLink').value
        });
        localStorage.setItem('apps', JSON.stringify(apps));
        render();
    }

    function changePass() {
        pass = document.getElementById('newPass').value;
        localStorage.setItem('adminPass', pass);
        alert('Şifre güncellendi!');
    }

    function deleteApp(i) { apps.splice(i, 1); localStorage.setItem('apps', JSON.stringify(apps)); render(); }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

    render();
</script>
</body>
</html>
