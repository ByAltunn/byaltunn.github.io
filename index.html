<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>dev/ByAltun | Professional Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; transition: 0.3s; }
        .dark { background: #f8fafc; color: #0f172a; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-white">

<!-- Navbar -->
<nav class="p-6 flex justify-between items-center glass sticky top-0 z-50">
    <div class="text-2xl font-bold text-indigo-500 cursor-pointer" onclick="clickCount()">dev/ByAltun</div>
    <div class="flex gap-4 items-center">
        <button onclick="toggleTheme()" class="text-xl">🌙</button>
        <select id="lang" onchange="render()" class="bg-slate-800 p-2 rounded">
            <option value="tr">🇹🇷 TR</option><option value="ua">🇺🇦 UA</option>
            <option value="en">🇺🇸 ENG</option><option value="ru">🇷🇺 RU</option>
        </select>
    </div>
</nav>

<!-- Duyurular -->
<div id="announcement" class="max-w-4xl mx-auto mt-10 p-6 bg-indigo-900/20 border border-indigo-500/30 rounded-2xl"></div>

<!-- Uygulamalar -->
<div class="max-w-6xl mx-auto p-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="appGrid"></div>

<!-- Admin Paneli (Gizli) -->
<div id="adminOverlay" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 p-8 rounded-3xl w-full max-w-2xl border border-indigo-500">
        <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
        <div id="loginArea">
            <input type="password" id="pass" class="w-full p-3 rounded bg-slate-800" placeholder="Admin Şifresi">
            <button onclick="verify()" class="mt-4 bg-indigo-600 px-6 py-2 rounded">Giriş</button>
        </div>
        <div id="panelArea" class="hidden">
            <input type="text" id="aName" placeholder="Uygulama Adı (Örn: {tr:'App1', en:'App1'})" class="w-full p-2 mb-2 bg-slate-800">
            <textarea id="aDesc" placeholder="Açıklamalar (JSON format: {tr:'...', en:'...'})" class="w-full p-2 mb-2 bg-slate-800"></textarea>
            <input type="text" id="aLink" placeholder="Link" class="w-full p-2 mb-2 bg-slate-800">
            <button onclick="saveApp()" class="bg-green-600 p-2 rounded">Kaydet / Ekle</button>
            <button onclick="closeAdmin()" class="bg-red-600 p-2 rounded">Kapat</button>
        </div>
    </div>
</div>

<footer class="text-center py-10 opacity-50">
    IP Address: <span id="ip">Loading...</span>
</footer>

<script>
    let clicks = 0;
    let apps = JSON.parse(localStorage.getItem('apps')) || [];
    
    // IP Fetch
    fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => document.getElementById('ip').innerText = data.ip);

    function clickCount() {
        clicks++;
        if(clicks === 4) document.getElementById('adminOverlay').style.display = 'flex';
    }

    function verify() {
        if(document.getElementById('pass').value === '1234') {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('panelArea').style.display = 'block';
        }
    }

    function saveApp() {
        const name = JSON.parse(document.getElementById('aName').value);
        const desc = JSON.parse(document.getElementById('aDesc').value);
        const link = document.getElementById('aLink').value;
        apps.push({name, desc, link});
        localStorage.setItem('apps', JSON.stringify(apps));
        render();
    }

    function render() {
        const lang = document.getElementById('lang').value;
        document.getElementById('appGrid').innerHTML = apps.map((app, i) => `
            <div class="glass p-6 rounded-2xl hover:scale-105 transition">
                <h3 class="text-xl font-bold">${app.name[lang]}</h3>
                <p class="mt-2 text-sm opacity-80">${app.desc[lang]}</p>
                <a href="${app.link}" class="mt-4 block bg-indigo-600 text-center py-2 rounded-lg">Google Play</a>
                <button onclick="deleteApp(${i})" class="text-red-400 mt-2 text-xs">Sil</button>
            </div>
        `).join('');
    }

    function deleteApp(i) { apps.splice(i, 1); localStorage.setItem('apps', JSON.stringify(apps)); render(); }
    function closeAdmin() { document.getElementById('adminOverlay').style.display = 'none'; }
    function toggleTheme() { document.body.classList.toggle('dark'); }

    render();
</script>
</body>
</html>
