<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dev/ByAltun | Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        /* Neomorfizm & Soft Gölgeler */
        .soft-card { background: #ffffff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 24px; transition: all 0.3s ease; }
        .soft-card:hover { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); transform: translateY(-5px); }
        .admin-glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); }
        
        /* Özel Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

<!-- NAVBAR -->
<nav class="w-full max-w-7xl mx-auto p-6 md:p-10 flex justify-between items-center z-40">
    <div class="flex items-center gap-3 cursor-pointer" onclick="clickLogo()">
        <div class="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-2xl font-black shadow-lg shadow-indigo-200">/A</div>
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">dev/ByAltun</h1>
    </div>
    <select id="langSelect" onchange="renderPublic()" class="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200 font-semibold text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="tr">🇹🇷 TR</option><option value="ua">🇺🇦 UA</option>
        <option value="en">🇺🇸 ENG</option><option value="ru">🇷🇺 RU</option>
    </select>
</nav>

<!-- DUYURU ALANI -->
<div id="publicAnnBox" class="max-w-4xl mx-auto px-6 w-full hidden mb-8">
    <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 text-indigo-800 font-medium flex items-start gap-4 shadow-sm">
        <span class="text-2xl">📢</span>
        <p id="publicAnnText" class="mt-1"></p>
    </div>
</div>

<!-- UYGULAMA VİTRİNİ (Sadece Gösterim) -->
<main class="flex-grow w-full max-w-7xl mx-auto px-6 pb-20">
    <div id="publicAppGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</main>

<!-- FOOTER (IP GÖSTERGESİ) -->
<footer class="w-full py-8 text-center text-slate-400 text-sm font-medium border-t border-slate-200">
    Designed by <span class="text-indigo-500">ByAltun</span> | Ziyaretçi IP: <span id="userIp" class="text-slate-600">Yükleniyor...</span>
</footer>

<!-- ========================================== -->
<!-- GİZLİ ADMİN PANELİ (TAM YÖNETİM)           -->
<!-- ========================================== -->
<div id="adminPanel" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 overflow-y-auto p-4 md:p-10 flex justify-center items-start">
    <div class="admin-glass w-full max-w-5xl rounded-3xl shadow-2xl border border-white p-8">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h2 class="text-3xl font-black text-slate-800">⚙️ Admin Kontrol Merkezi</h2>
            <button onclick="closeAdmin()" class="bg-red-100 text-red-600 px-4 py-2 rounded-xl font-bold hover:bg-red-200 transition">Kapat</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- SOL KOLON: Ayarlar & Duyuru -->
            <div class="space-y-6">
                <!-- Şifre Yönetimi -->
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    <h3 class="font-bold text-slate-700 mb-4 flex justify-between">
                        <span>🔑 Şifre Yönetimi</span>
                        <span class="text-indigo-600 font-mono text-sm" id="adminPassView"></span>
                    </h3>
                    <input type="text" id="newPassInput" placeholder="Yeni Şifre Belirle" class="w-full p-3 rounded-xl border border-slate-300 mb-3 focus:ring-2 focus:ring-indigo-500">
                    <button onclick="changePassword()" class="w-full bg-slate-800 text-white font-semibold py-2 rounded-xl">Şifreyi Güncelle</button>
                </div>

                <!-- Duyuru Yönetimi -->
                <div class="bg-indigo-50/50 p-6 rounded-2xl border border-indigo-100">
                    <h3 class="font-bold text-indigo-900 mb-4">📢 Duyuru Yönetimi</h3>
                    <textarea id="annTr" placeholder="Duyuru (TR)" class="w-full p-2 mb-2 rounded-lg border border-slate-200 text-sm"></textarea>
                    <textarea id="annUa" placeholder="Duyuru (UA)" class="w-full p-2 mb-2 rounded-lg border border-slate-200 text-sm"></textarea>
                    <textarea id="annEn" placeholder="Duyuru (ENG)" class="w-full p-2 mb-2 rounded-lg border border-slate-200 text-sm"></textarea>
                    <textarea id="annRu" placeholder="Duyuru (RU)" class="w-full p-2 mb-3 rounded-lg border border-slate-200 text-sm"></textarea>
                    <div class="flex gap-2">
                        <button onclick="saveAnnouncement()" class="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-xl">Yayınla</button>
                        <button onclick="clearAnnouncement()" class="flex-1 bg-red-500 text-white font-bold py-2 rounded-xl">Kaldır</button>
                    </div>
                </div>
            </div>

            <!-- SAĞ KOLON: Uygulama Ekle/Düzenle & Liste -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Uygulama Formu -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-slate-800 mb-4 text-xl" id="formTitle">📱 Yeni Uygulama Ekle</h3>
                    <input type="hidden" id="editAppId" value="-1">
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-400 uppercase">Uygulama Adı</label>
                            <input id="appNameTr" placeholder="TR Adı" class="w-full p-2 rounded-lg border bg-slate-50">
                            <input id="appNameUa" placeholder="UA Adı" class="w-full p-2 rounded-lg border bg-slate-50">
                            <input id="appNameEn" placeholder="ENG Adı" class="w-full p-2 rounded-lg border bg-slate-50">
                            <input id="appNameRu" placeholder="RU Adı" class="w-full p-2 rounded-lg border bg-slate-50">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-400 uppercase">Kısa Açıklama</label>
                            <input id="appDescTr" placeholder="TR Açıklama" class="w-full p-2 rounded-lg border bg-slate-50">
                            <input id="appDescUa" placeholder="UA Açıklama" class="w-full p-2 rounded-lg border bg-slate-50">
                            <input id="appDescEn" placeholder="ENG Açıklama" class="w-full p-2 rounded-lg border bg-slate-50">
                            <input id="appDescRu" placeholder="RU Açıklama" class="w-full p-2 rounded-lg border bg-slate-50">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="text-xs font-bold text-slate-400 uppercase">Google Play Linki</label>
                        <input id="appLink" placeholder="https://play.google.com/store/apps/details?id=..." class="w-full p-3 mt-1 rounded-xl border bg-slate-50">
                    </div>
                    
                    <div class="flex gap-3">
                        <button onclick="saveApp()" id="saveAppBtn" class="flex-1 bg-green-500 text-white font-bold py-3 rounded-xl hover:bg-green-600 transition">Listeye Ekle</button>
                        <button onclick="resetAppForm()" id="cancelEditBtn" class="hidden bg-slate-200 text-slate-700 font-bold py-3 px-6 rounded-xl">İptal</button>
                    </div>
                </div>

                <!-- Ekli Uygulamalar Listesi (SADECE ADMİNDE) -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-slate-800 mb-4">📋 Yayındaki Uygulamalar</h3>
                    <div id="adminAppList" class="space-y-3 max-h-[300px] overflow-y-auto pr-2">
                        <!-- Liste buraya gelecek -->
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    // F12 ve Sağ Tık Engeli
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };

    // Veri Tabanı (LocalStorage)
    let apps = JSON.parse(localStorage.getItem('byaltun_apps')) || [];
    let ann = JSON.parse(localStorage.getItem('byaltun_ann')) || {tr:"", ua:"", en:"", ru:"", active: false};
    let adminPass = localStorage.getItem('byaltun_pass') || '1234';
    let logoClicks = 0;

    // Kullanıcı IP Adresi Çekme
    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => { document.getElementById('userIp').innerText = data.ip; })
        .catch(() => { document.getElementById('userIp').innerText = "Gizli"; });

    // === ANA SAYFA (PUBLIC) FONKSİYONLARI ===
    function renderPublic() {
        const lang = document.getElementById('langSelect').value;
        
        // Duyuruyu Bas
        const annBox = document.getElementById('publicAnnBox');
        if (ann.active && ann[lang] && ann[lang].trim() !== "") {
            annBox.classList.remove('hidden');
            document.getElementById('publicAnnText').innerText = ann[lang];
        } else {
            annBox.classList.add('hidden');
        }

        // Uygulamaları Bas (Sadece Vitrin, Silme/Düzenleme Yok)
        const grid = document.getElementById('publicAppGrid');
        if(apps.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">Henüz uygulama eklenmedi.</div>`;
            return;
        }

        grid.innerHTML = apps.map(app => `
            <div class="soft-card p-8 flex flex-col h-full">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-3xl mb-6">🤖</div>
                <h3 class="text-2xl font-bold text-slate-800 mb-2 leading-tight">${app.name[lang] || app.name.en || 'İsimsiz'}</h3>
                <p class="text-slate-500 text-sm mb-8 flex-grow">${app.desc[lang] || app.desc.en || 'Açıklama yok.'}</p>
                <a href="${app.link}" target="_blank" class="block w-full py-3.5 bg-slate-900 text-white text-center rounded-xl font-bold hover:bg-indigo-600 transition-colors shadow-md">
                    Google Play'den İndir
                </a>
            </div>
        `).join('');
    }

    // === ADMİN GİRİŞ SİSTEMİ ===
    function clickLogo() {
        logoClicks++;
        clearTimeout(window.clickTimer);
        window.clickTimer = setTimeout(() => { logoClicks = 0; }, 2000); // 2 saniye içinde 4 kere tıklanmalı

        if (logoClicks >= 4) {
            let p = prompt("Geliştirici Şifresi:");
            if (p === adminPass) {
                openAdmin();
            } else if (p !== null) {
                alert("Hatalı şifre!");
            }
            logoClicks = 0;
        }
    }

    function openAdmin() {
        document.getElementById('adminPanel').classList.remove('hidden');
        document.body.style.overflow = 'hidden'; // Arka plan scrollunu kapat
        document.getElementById('adminPassView').innerText = adminPass;
        
        // Duyuru inputlarını doldur
        document.getElementById('annTr').value = ann.tr || "";
        document.getElementById('annUa').value = ann.ua || "";
        document.getElementById('annEn').value = ann.en || "";
        document.getElementById('annRu').value = ann.ru || "";
        
        renderAdminAppList();
    }

    function closeAdmin() {
        document.getElementById('adminPanel').classList.add('hidden');
        document.body.style.overflow = 'auto';
        resetAppForm();
        renderPublic(); // Çıkarken ana sayfayı güncelle
    }

    // === ADMİN İŞLEMLERİ: ŞİFRE & DUYURU ===
    function changePassword() {
        const newP = document.getElementById('newPassInput').value;
        if(newP.trim().length > 0) {
            adminPass = newP;
            localStorage.setItem('byaltun_pass', adminPass);
            document.getElementById('adminPassView').innerText = adminPass;
            document.getElementById('newPassInput').value = "";
            alert("Şifre başarıyla değiştirildi.");
        }
    }

    function saveAnnouncement() {
        ann = {
            active: true,
            tr: document.getElementById('annTr').value,
            ua: document.getElementById('annUa').value,
            en: document.getElementById('annEn').value,
            ru: document.getElementById('annRu').value
        };
        localStorage.setItem('byaltun_ann', JSON.stringify(ann));
        alert("Duyuru yayınlandı!");
    }

    function clearAnnouncement() {
        ann = {active: false, tr:"", ua:"", en:"", ru:""};
        localStorage.setItem('byaltun_ann', JSON.stringify(ann));
        document.getElementById('annTr').value = "";
        document.getElementById('annUa').value = "";
        document.getElementById('annEn').value = "";
        document.getElementById('annRu').value = "";
        alert("Duyuru yayından kaldırıldı.");
    }

    // === ADMİN İŞLEMLERİ: UYGULAMA YÖNETİMİ (EKLE/DÜZENLE/SİL) ===
    function renderAdminAppList() {
        const listDiv = document.getElementById('adminAppList');
        if(apps.length === 0) {
            listDiv.innerHTML = `<p class="text-sm text-slate-400 italic">Sistemde kayıtlı uygulama yok.</p>`;
            return;
        }

        listDiv.innerHTML = apps.map((app, i) => `
            <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-lg">
                <div>
                    <strong class="text-slate-800 block">${app.name.tr || 'İsimsiz Uygulama'}</strong>
                    <span class="text-xs text-slate-500 truncate w-48 block">${app.link}</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="loadAppToEdit(${i})" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded text-sm font-bold hover:bg-indigo-200">Düzenle</button>
                    <button onclick="deleteApp(${i})" class="bg-red-100 text-red-700 px-3 py-1 rounded text-sm font-bold hover:bg-red-200">Sil</button>
                </div>
            </div>
        `).join('');
    }

    function saveApp() {
        const id = parseInt(document.getElementById('editAppId').value);
        
        const appData = {
            name: {
                tr: document.getElementById('appNameTr').value,
                ua: document.getElementById('appNameUa').value,
                en: document.getElementById('appNameEn').value,
                ru: document.getElementById('appNameRu').value
            },
            desc: {
                tr: document.getElementById('appDescTr').value,
                ua: document.getElementById('appDescUa').value,
                en: document.getElementById('appDescEn').value,
                ru: document.getElementById('appDescRu').value
            },
            link: document.getElementById('appLink').value
        };

        if (id === -1) {
            apps.push(appData); // Yeni Ekle
        } else {
            apps[id] = appData; // Mevcudu Güncelle
        }

        localStorage.setItem('byaltun_apps', JSON.stringify(apps));
        resetAppForm();
        renderAdminAppList();
    }

    function loadAppToEdit(index) {
        const app = apps[index];
        document.getElementById('editAppId').value = index;
        document.getElementById('formTitle').innerHTML = "✏️ Uygulamayı Düzenle";
        document.getElementById('saveAppBtn').innerText = "Değişiklikleri Kaydet";
        document.getElementById('saveAppBtn').className = "flex-1 bg-indigo-500 text-white font-bold py-3 rounded-xl hover:bg-indigo-600 transition";
        document.getElementById('cancelEditBtn').classList.remove('hidden');

        // Formu doldur
        document.getElementById('appNameTr').value = app.name.tr || "";
        document.getElementById('appNameUa').value = app.name.ua || "";
        document.getElementById('appNameEn').value = app.name.en || "";
        document.getElementById('appNameRu').value = app.name.ru || "";
        
        document.getElementById('appDescTr').value = app.desc.tr || "";
        document.getElementById('appDescUa').value = app.desc.ua || "";
        document.getElementById('appDescEn').value = app.desc.en || "";
        document.getElementById('appDescRu').value = app.desc.ru || "";
        
        document.getElementById('appLink').value = app.link || "";
    }

    function deleteApp(index) {
        if(confirm("Bu uygulamayı tamamen silmek istediğine emin misin?")) {
            apps.splice(index, 1);
            localStorage.setItem('byaltun_apps', JSON.stringify(apps));
            renderAdminAppList();
            if(parseInt(document.getElementById('editAppId').value) === index) resetAppForm();
        }
    }

    function resetAppForm() {
        document.getElementById('editAppId').value = "-1";
        document.getElementById('formTitle').innerHTML = "📱 Yeni Uygulama Ekle";
        document.getElementById('saveAppBtn').innerText = "Listeye Ekle";
        document.getElementById('saveAppBtn').className = "flex-1 bg-green-500 text-white font-bold py-3 rounded-xl hover:bg-green-600 transition";
        document.getElementById('cancelEditBtn').classList.add('hidden');

        // Formu temizle
        const inputs = ['appNameTr', 'appNameUa', 'appNameEn', 'appNameRu', 'appDescTr', 'appDescUa', 'appDescEn', 'appDescRu', 'appLink'];
        inputs.forEach(id => document.getElementById(id).value = "");
    }

    // İlk Yükleme
    renderPublic();
</script>
</body>
</html>
