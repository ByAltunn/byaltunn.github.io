<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByAltun | Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; color: #1e293b; }
        .card { background: #ffffff; box-shadow: 10px 10px 20px #d1d5db, -10px -10px 20px #ffffff; border-radius: 20px; transition: 0.3s; }
        .btn { background: #4f46e5; color: white; border-radius: 12px; }
    </style>
</head>
<body class="p-5 md:p-10">

<!-- Nav -->
<nav class="flex justify-between items-center mb-12">
    <h1 class="text-3xl font-extrabold text-indigo-600 cursor-pointer" onclick="openAdmin()">ByAltun.dev 🤖</h1>
    <select id="lang" onchange="render()" class="bg-white p-2 rounded-lg shadow-inner border">
        <option value="tr">🇹🇷 TR</option><option value="ua">🇺🇦 UA</option>
        <option value="en">🇺🇸 ENG</option><option value="ru">🇷🇺 RU</option>
    </select>
</nav>

<!-- Duyuru -->
<div id="announcementBox" class="max-w-4xl mx-auto mb-10 p-6 bg-indigo-50 border-l-4 border-indigo-500 rounded-lg shadow-md italic"></div>

<!-- Grid -->
<div id="appGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 max-w-7xl mx-auto"></div>

<!-- Admin Paneli -->
<div id="adminPanel" class="hidden fixed inset-0 bg-gray-900/80 z-50 flex justify-center items-center p-4">
    <div class="bg-white p-8 rounded-3xl w-full max-w-lg shadow-2xl">
        <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
        <input type="text" id="nTr" placeholder="Ad (TR)" class="w-full p-2 mb-2 border rounded">
        <textarea id="dTr" placeholder="Açıklama (TR)" class="w-full p-2 mb-2 border rounded"></textarea>
        <input type="text" id="link" placeholder="Google Play URL" class="w-full p-2 mb-4 border rounded">
        <button onclick="addApp()" class="w-full bg-green-500 text-white p-3 rounded-xl font-bold">Uygulamayı Ekle</button>
        <button onclick="closeAdmin()" class="w-full mt-2 bg-gray-200 p-3 rounded-xl">Kapat</button>
    </div>
</div>

<footer class="text-center mt-20 opacity-50">
    Ziyaretçi IP: <span id="ip">Bulunuyor...</span>
</footer>

<script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    let apps = JSON.parse(localStorage.getItem('apps')) || [];
    let pass = localStorage.getItem('adminPass') || '1234';

    fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => document.getElementById('ip').innerText = d.ip);

    function render() {
        const lang = document.getElementById('lang').value;
        document.getElementById('appGrid').innerHTML = apps.map((app, i) => `
            <div class="card p-6 flex flex-col items-center text-center">
                <div class="text-5xl mb-4">🤖</div>
                <h3 class="text-xl font-bold">${app.name[lang] || app.name.tr}</h3>
                <p class="mt-2 text-sm text-gray-600">${app.desc[lang] || app.desc.tr}</p>
                <a href="${app.link}" target="_blank" class="btn mt-6 px-6 py-2 shadow-lg">Google Play İndir</a>
                <button onclick="delApp(${i})" class="mt-4 text-red-500 text-xs">Uygulamayı Kaldır</button>
            </div>
        `).join('');
    }

    function addApp() {
        apps.push({
            name: {tr: document.getElementById('nTr').value},
            desc: {tr: document.getElementById('dTr').value},
            link: document.getElementById('link').value
        });
        localStorage.setItem('apps', JSON.stringify(apps));
        render(); closeAdmin();
    }

    function openAdmin() {
        let p = prompt("Admin Şifresi:");
        if(p === pass) document.getElementById('adminPanel').style.display = 'flex';
    }

    function delApp(i) { if(confirm('Silinsin mi?')) { apps.splice(i, 1); localStorage.setItem('apps', JSON.stringify(apps)); render(); } }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

    render();
</script>
</body>
</html>
